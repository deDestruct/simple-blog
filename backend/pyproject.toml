[project]
name = "backend"
version = "0.1.0"
description = "Simple blog project"
readme = "README.md"
authors = [
    { name = "deDestruct", email = "131010266+deDestruct@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.162.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "ty>=0.0.95",
]

[tool.fastapi]
entrypoint = "blog_api.main:app"      # где приложение — для команды fastapi

[tool.ruff.lint]
extend-select = ["E", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]              # B008 — см. ниже

[tool.pytest]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra"]

[tool.pyright]
typeCheckingMode = "standard"
include = ["src", "tests"]
